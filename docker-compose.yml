services:
  rolloutctrl-postgres:
    image: postgres:18-alpine
    container_name: rolloutctrl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rolloutctrl
    ports:
      - "5432:5432"
    volumes:
      - rolloutctrl_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rolloutctrl-redis:
    image: redis:7-alpine
    container_name: rolloutctrl-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rolloutctrl_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  rolloutctrl_postgres_data:
  rolloutctrl_redis_data: